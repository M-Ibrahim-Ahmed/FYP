<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ScamShield</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ─── Header ─── -->
  <header class="header">
    <div class="header-brand">
      <img src="icons/icon48.png" alt="ScamShield" class="header-icon" />
      <div>
        <h1 class="header-title">ScamShield</h1>
        <p class="header-subtitle">Real-Time URL Scanner</p>
      </div>
    </div>
    <button id="scanBtn" class="scan-btn" title="Scan this page">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.5 2.5v4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2.5 8a5.5 5.5 0 0 1 9.37-3.9L13.5 5.5M2.5 13.5v-4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.5 8a5.5 5.5 0 0 1-9.37 3.9L2.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Scan Page
    </button>
  </header>

  <!-- ─── Page Info ─── -->
  <div class="page-info">
    <p id="page-title" class="page-title">Loading…</p>
    <p id="page-url" class="page-url"></p>
  </div>

  <!-- ─── Status Bar ─── -->
  <div id="status" class="status status-loading">⏳ Loading…</div>

  <!-- ─── Risk Banner ─── -->
  <div id="risk-banner" class="risk-banner" style="display:none;">
    <div class="risk-banner-left">
      <span id="risk-label" class="risk-label"></span>
      <span id="risk-score" class="risk-score-text"></span>
    </div>
    <span id="risk-details" class="risk-details"></span>
  </div>

  <!-- ─── Stats Bar ─── -->
  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-value" id="stat-links">0</span>
      <span class="stat-label">Links</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-forms">0</span>
      <span class="stat-label">Forms</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-images">0</span>
      <span class="stat-label">Images</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-redirects">0</span>
      <span class="stat-label">Redirects</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-iframes">0</span>
      <span class="stat-label">Iframes</span>
    </div>
  </div>

  <!-- ─── Tab Bar ─── -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="links">🔗 Links</button>
    <button class="tab-btn" data-tab="forms">📝 Forms</button>
    <button class="tab-btn" data-tab="images">🖼️ Images</button>
    <button class="tab-btn" data-tab="redirects">↪️ Redirects</button>
    <button class="tab-btn" data-tab="iframes">📦 Iframes</button>
    <button class="tab-btn" data-tab="history">📊 History</button>
  </nav>

  <!-- ─── Tab Panels ─── -->
  <div class="tab-content">
    <div id="panel-links" class="tab-panel active"></div>
    <div id="panel-forms" class="tab-panel"></div>
    <div id="panel-images" class="tab-panel"></div>
    <div id="panel-redirects" class="tab-panel"></div>
    <div id="panel-iframes" class="tab-panel"></div>
    <div id="panel-history" class="tab-panel"></div>
  </div>

  <!-- ─── Safe Preview Overlay ─── -->
  <div id="preview-overlay" class="preview-overlay" style="display:none;">
    <div class="preview-modal">
      <div class="preview-header">
        <span class="preview-title">🔒 Safe Preview</span>
        <button id="preview-close" class="preview-close">✕</button>
      </div>
      <div id="preview-url" class="preview-url"></div>
      <div id="preview-body" class="preview-body">
        <div class="empty-state"><span class="empty-icon">📸</span><p>Loading preview…</p></div>
      </div>
    </div>
  </div>

  <!-- ─── Footer ─── -->
  <footer class="footer">
    <span>ScamShield v1.0</span>
    <button id="exportBtn" class="export-btn" title="Export scan report as CSV">📥 Export</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
